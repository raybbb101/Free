<script>
(() => {
'use strict';

/* =========================================================================
   Constants
   ========================================================================= */
const Q = new URLSearchParams(location.search);
const N = 1024, CELL = 14, WORLD = N * CELL;          // terrain tile: 14.3 km
const CN = 512, CLOUD_W = 9000, CB = 1150, CT = 300;  // cloud tile + layer
const DEG = Math.PI / 180;
const NEAR = 0.5, FAR = 60000;
const SUN = (() => { const el = 14 * DEG, az = 245 * DEG; return [Math.cos(el) * Math.sin(az), Math.sin(el), -Math.cos(el) * Math.cos(az)]; })();
const SHD = (() => { const h = Math.hypot(SUN[0], SUN[2]); const v = [SUN[0] / h * 0.45, 1, SUN[2] / h * 0.45]; const l = Math.hypot(v[0], v[1], v[2]); return v.map(a => a / l); })();

const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const smoother = t => { t = clamp(t, 0, 1); return t * t * t * (t * (t * 6 - 15) + 10); };
const wrapPI = a => { a = (a + Math.PI) % (2 * Math.PI); if (a < 0) a += 2 * Math.PI; return a - Math.PI; };
const rnd = (a = 0, b = 1) => a + Math.random() * (b - a);
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const len = a => Math.hypot(a[0], a[1], a[2]);
const norm = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bay = (x, y) => (BAYER[(x & 3) + (y & 3) * 4] + 0.5) / 16;
const hex3 = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };

/* =========================================================================
   Terrain generation worker (tiling noise, shadows, clouds)
   ========================================================================= */
const WORKER_SRC = `
const G = new Float32Array(512);
for (let i = 0; i < 256; i++) { const a = i / 256 * Math.PI * 2; G[i*2] = Math.cos(a); G[i*2+1] = Math.sin(a); }
function hh(x, y, s) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 982451653)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return h >>> 0; }
function gn(x, y, P, s) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const x0 = ((ix % P) + P) % P, y0 = ((iy % P) + P) % P, x1 = (x0 + 1) % P, y1 = (y0 + 1) % P;
  const ux = fx*fx*fx*(fx*(fx*6-15)+10), uy = fy*fy*fy*(fy*(fy*6-15)+10);
  let g = (hh(x0, y0, s) & 255) * 2; const n00 = G[g]*fx + G[g+1]*fy;
  g = (hh(x1, y0, s) & 255) * 2; const n10 = G[g]*(fx-1) + G[g+1]*fy;
  g = (hh(x0, y1, s) & 255) * 2; const n01 = G[g]*fx + G[g+1]*(fy-1);
  g = (hh(x1, y1, s) & 255) * 2; const n11 = G[g]*(fx-1) + G[g+1]*(fy-1);
  const a = n00 + (n10 - n00) * ux, b = n01 + (n11 - n01) * ux; return (a + (b - a) * uy) * 1.42;
}
function fbm(u, v, P, oct, s) { let sum = 0, amp = 1, nrm = 0; for (let o = 0; o < oct; o++) { sum += gn(u*P, v*P, P, s + o*17) * amp; nrm += amp; amp *= 0.5; P *= 2; } return sum / nrm; }
function ridged(u, v, P, oct, s) { let sum = 0, amp = 1, nrm = 0, w = 1; for (let o = 0; o < oct; o++) { let n = 1 - Math.abs(gn(u*P, v*P, P, s + o*31)); n *= n; n *= w; w = Math.min(1, Math.max(0, n * 1.7)); sum += n * amp; nrm += amp; amp *= 0.5; P *= 2; } return sum / nrm; }
function sstep(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
function region(u, v, R) {
  const ru = u + fbm(u, v, 4, 3, 301) * 0.035, rv = v + fbm(u, v, 4, 3, 302) * 0.035;
  let d1 = 9, d2 = 9, i1 = 0, i2 = 0;
  for (let i = 0; i < R.length; i += 3) {
    let dx = ru - R[i], dy = rv - R[i+1]; dx -= Math.round(dx); dy -= Math.round(dy);
    const dd = Math.sqrt(dx*dx + dy*dy);
    if (dd < d1) { d2 = d1; i2 = i1; d1 = dd; i1 = i; } else if (dd < d2) { d2 = dd; i2 = i; }
  }
  return { i1: i1 / 3, i2: i2 / 3, t1: R[i1+2], t2: R[i2+2], gap: d2 - d1 };
}
function heightRows(N, y0, y1, R, WM) {
  const out = new Float32Array((y1 - y0) * N * 4), bio = new Uint8Array((y1 - y0) * N * 5);
  for (let y = y0; y < y1; y++) {
    for (let x = 0; x < N; x++) {
      const u = (x + 0.5) / N, v = (y + 0.5) / N;
      const wx = fbm(u, v, 3, 3, 101) * 0.055, wy = fbm(u, v, 3, 3, 202) * 0.055;
      const uu = u + wx, vv = v + wy;
      const cont = fbm(uu, vv, 3, 3, 1);
      const hills = fbm(uu, vv, 8, 6, 2);
      const mm = sstep(0.02, 0.42, fbm(u, v, 3, 2, 3) + 0.08);
      const rg = ridged(uu, vv, 7, 5, 4);
      let h = cont * 210 + hills * 125 + mm * rg * rg * 1150 + mm * 110;
      const rgn = region(u, v, R), gm = rgn.gap * 0.5 * WM;
      const w1 = 0.5 + 0.5 * sstep(0, 300, gm), w = [0, 0, 0, 0]; w[rgn.t1] += w1; w[rgn.t2] += 1 - w1;
      h = h * (1 - 0.55 * w[3]) + 35 * w[3];
      h += w[1] * 50;
      for (let k = 0; k < R.length; k += 3) {
        if (R[k+2] !== 2) continue;
        let dx = u - R[k], dy = v - R[k+1]; dx -= Math.round(dx); dy -= Math.round(dy);
        const dm = Math.sqrt(dx*dx + dy*dy) * WM;
        if (dm < 2600) { const c = 1 - dm / 2600; h = h * (1 - c * 0.7) + 1250 * Math.pow(c, 1.7) + 80 * c; if (dm < 280) h -= (1 - (dm / 280) * (dm / 280)) * 230; }
      }
      const i = ((y - y0) * N + x) * 4;
      out[i] = h; out[i+1] = fbm(u, v, 20, 4, 21); out[i+2] = fbm(u, v, 28, 3, 22) * 0.5 + 0.5; out[i+3] = 1;
      const b = ((y - y0) * N + x) * 5;
      bio[b] = Math.round(w[1] * 255); bio[b+1] = Math.round(w[2] * 255); bio[b+2] = Math.round(w[3] * 255);
      bio[b+3] = Math.round(Math.max(0, 1 - gm / 120) * 255); bio[b+4] = rgn.i1;
    }
    if ((y & 7) === 7) postMessage({ type: 'p', n: 8 });
  }
  return { out, bio };
}
function bumps(u, v, P, s) {
  const x = u * P, y = v * P, ix = Math.floor(x), iy = Math.floor(y); let m = 0;
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
    const cx = ix + i, cy = iy + j, wx = ((cx % P) + P) % P, wy = ((cy % P) + P) % P, h = hh(wx, wy, s);
    const px = cx + 0.2 + ((h & 255) / 255) * 0.6, py = cy + 0.2 + (((h >>> 8) & 255) / 255) * 0.6;
    const r = 0.42 + (((h >>> 16) & 255) / 255) * 0.42;
    const dx = x - px, dy = y - py, q = 1 - (dx*dx + dy*dy) / (r*r);
    if (q > 0) { const d = Math.sqrt(q); if (d > m) m = d; }
  }
  return m;
}
function cloudMap(CN) {
  const out = new Uint8Array(CN * CN);
  for (let y = 0; y < CN; y++) for (let x = 0; x < CN; x++) {
    const u = (x + 0.5) / CN, v = (y + 0.5) / CN;
    const cover = fbm(u, v, 3, 3, 51);
    let t = bumps(u, v, 13, 61) * 0.7 + bumps(u, v, 28, 62) * 0.38 + bumps(u, v, 60, 63) * 0.2;
    t *= sstep(-0.1, 0.3, cover);
    t = (t - 0.55) / 0.6;
    out[y * CN + x] = Math.round(Math.sqrt(Math.max(0, Math.min(1, t))) * 255);
  }
  return out;
}
let H = null;
function shadowRows(N, cell, y0, y1, sx, sz, tanE, maxH) {
  const out = new Float32Array((y1 - y0) * N), M = N - 1, stp = 1.25;
  for (let y = y0; y < y1; y++) {
    for (let x = 0; x < N; x++) {
      const h0 = Math.max(H[y*N + x], 0); let s = 1;
      for (let k = 1; k < 240; k++) {
        const d = k * stp, rayH = h0 + d * cell * tanE + 1.5;
        if (rayH > maxH) break;
        const fx0 = x + sx * d, fy0 = y + sz * d, ix = Math.floor(fx0), iy = Math.floor(fy0), fx = fx0 - ix, fy = fy0 - iy;
        const a0 = ix & M, b0 = iy & M, a1 = (a0 + 1) & M, b1 = (b0 + 1) & M;
        const p = H[b0*N + a0], q = H[b0*N + a1], r = H[b1*N + a0], t = H[b1*N + a1];
        const top = p + (q - p) * fx, bot = r + (t - r) * fx, th = top + (bot - top) * fy;
        const v = (rayH - th) / (d * cell * 0.02 + 2) + 0.5;
        if (v < s) { s = v; if (s <= 0) { s = 0; break; } }
      }
      out[(y - y0) * N + x] = Math.max(0, Math.min(1, s));
    }
    if ((y & 7) === 7) postMessage({ type: 'p', n: 8 });
  }
  return out;
}
onmessage = e => {
  const m = e.data;
  if (m.kind === 'height') { const r = heightRows(m.N, m.y0, m.y1, m.R, m.WM); postMessage({ type: 'done', y0: m.y0, data: r.out, bio: r.bio }, [r.out.buffer, r.bio.buffer]); }
  else if (m.kind === 'cloud') { const d = cloudMap(m.CN); postMessage({ type: 'p', n: 32 }); postMessage({ type: 'done', cloud: true, data: d }, [d.buffer]); }
  else if (m.kind === 'setH') { H = m.H; }
  else if (m.kind === 'shadow') { const d = shadowRows(m.N, m.cell, m.y0, m.y1, m.sx, m.sz, m.tanE, m.maxH); postMessage({ type: 'done', y0: m.y0, data: d }, [d.buffer]); }
};
`;

/* Countries: each region of the map has its own landscape */
const BIOME = { AUTUMN: 0, ICE: 1, VOLCANO: 2, FARM: 3 };
const BIOME_LABEL = ['Autumn woods', 'Ice fields', 'Volcanic land', 'Farmland'];
const COUNTRIES = (() => {
  const defs = [['Ambervale', 0], ['Frostmark', 1], ['Millbrook', 3], ['Ashkarra', 2], ['Rustwood', 0], ['Wheatmere', 3], ['Glacia', 1], ['Cindral', 2], ['Greenhollow', 3]];

      if (p.y - uCB < 4. && rd.y > 0.) n = vec3(0, -1, 0);
      else { float e = 20.; float tx = (CLD(p.xz + vec2(e, 0)) - CLD(p.xz - vec2(e, 0))) * uCT / (2. * e); float tz = (CLD(p.xz + vec2(0, e)) - CLD(p.xz - vec2(0, e))) * uCT / (2. * e); n = normalize(vec3(-tx, 1., -tz)); }
      return t;
    }
    lt = t; t += max(clamp(t * .02, 10., 350.), seg);
    if (t > t1) break;
  }
  return -1.;
}

float marchTerrain(vec3 ro, vec3 rd, float tmax){
  float top = uMaxH + 2., t = 0.;
  if (ro.y > top) { if (rd.y >= 0.) return -1.; t = (ro.y - top) / -rd.y; }
  if (t > tmax) return -1.;
  float lt = t;
  for (int i = 0; i < 180; i++) {
    vec3 p = ro + rd * t;
    float d = p.y - max(HT(p.xz), 0.);
    if (d < .002 * t + .03) {
      float a = lt, b = t;
      for (int j = 0; j < 6; j++) { float m = (a + b) * .5; vec3 q = ro + rd * m; if (q.y - max(HT(q.xz), 0.) < 0.) b = m; else a = m; }
      return b;
    }
    lt = t; t += max(d * .42, .5 + t * .0022);
    if (t > tmax || (p.y > top && rd.y > 0.)) break;
  }
  return -1.;
}

vec3 effects(vec3 col, vec3 p, bool water, float bay){
  for (int i = 0; i < 6; i++) {
    vec4 b = uBoom[i]; if (b.w < 0.) continue;
    float d = length(p.xz - b.xz), age = b.w;
    if (age < 1.3) { float r = age * 230., w = 2.5 + age * 5.; if (abs(d - r) < w && abs(p.y - b.y) < 70. && (1. - age / 1.3) > bay * .9) col = #fff0d8; }
    if (age < .5) col = mix(col, #ffd890, clamp((1. - age / .5) * 1.5 * exp(-d / 85.), 0., 1.));
    if (water && uBoomW[i] > .5 && age < 9.) { float fr = 10. + age * 7., k = 1. - age / 9.; if (d < fr && h21(p.xz / 2.5 + floor(age * 2.) * 7.) < k * (1.25 - d / fr)) col = #f4f0e8; }
  }
  if (!water) for (int i = 0; i < 8; i++) {
    vec4 s = uScor[i]; if (s.w < 0.) continue;
    float d = length(p.xz - s.xz), r = 18. + vn(p.xz * .12) * 16., fade = 1. - smoothstep(40., 70., s.w);
    if (d < r && fade > bay) {
      col = d < r * .55 ? #241c28 : #3c3038;
      if (s.w < 30. && d < r * .7 && h21(p.xz / 2. + floor(uT * 2.5 + float(i) * 7.)) > .95) col = #ff9020;
    }
  }
  return col;
}

vec3 shadeLava(vec3 p, float t, float bay){
  float n = vn(p.xz / 22. + uT * vec2(.35, .18)) + vn(p.xz / 8. - uT * vec2(.2, .3)) * .5;
  float k = n / 1.5 + (bay - .5) * .22 + sin(uT * 2. + p.x * .05) * .04;
  vec3 c = k > .8 ? #fff4c0 : k > .62 ? #ffd040 : k > .45 ? #ff9020 : k > .32 ? #e04818 : #902818;
  float cr = vn(p.xz / 34. + uT * .03);
  if (cr > .66 && abs(vn(p.xz / 6.) - .5) > .06) c = cr > .74 ? #2a2232 : #3c3444;
  return effects(c, p, false, bay);
}
vec3 shadeIce(vec3 p, vec4 tx, float t, float bay){
  float sh = tx.a * cloudShadow(p) * jetShadow(p);
  float k = vn(p.xz / 60.) + (bay - .5) * .3;
  vec3 c = k > .55 ? #e8f4f8 : #b8d8e8;
  if (vn(p.xz / 110. + 9.) > .64) c = #fff8f0;
  float a = vn(p.xz / 45.), b2 = vn(p.zx / 70. + 3.);
  if (abs(a - .5) < .012 || abs(b2 - .5) < .01) c = #8ab0cc;
  if (sh < .5 + (bay - .5) * .4) c = c == #fff8f0 ? #e0d8f0 : #8ab0cc;
  float near = smoothstep(3000., 500., t);
  if (near > 0. && h21(p.xz / 4. + floor(uT * 3.) * vec2(5., 9.)) > 1. - .003 * near * sh) c = #ffffff;
  return effects(c, p, false, bay);
}
vec3 shadeWater(vec3 p, vec3 rd, vec4 tx, float t, float bay){
  float depth = -tx.r;
  float near = smoothstep(4000., 900., t);
  float k = depth + (bay - .5) * (.7 + depth * .18);
  vec3 c = k < 1.2 ? #a8e8d8 : k < 3.5 ? #6cc8c4 : k < 8. ? #3a9cb0 : k < 16. ? #2a6e98 : k < 30. ? #1e4a7a : #162e5a;
  float sh = tx.a * cloudShadow(p) * jetShadow(p);
  if (sh < .5 + (bay - .5) * .4) c *= vec3(.66, .62, .8);
  vec2 w = vec2(vn(p.xz * .07 + uT * vec2(.3, .2)), vn(p.xz * .1 - uT * vec2(.2, .33))) - .5;
  vec3 nw = normalize(vec3(w.x * .28, 1., w.y * .28));
  vec3 rr = reflect(rd, nw);
  float fr = pow(1. - max(-rd.y, 0.), 5.);
  c = mix(c, skyCol(rr, false), clamp(fr * .9, 0., .85));
  float sp = dot(rr, uSun);
  float path = smoothstep(.93, .995, sp) * sh;
  if (h21(p.xz / 3. + floor(uT * 4.) * vec2(7., 13.)) < path * .55) c = sp > .985 ? #fff8e2 : #ffe0a0;
  if (near > 0. && h21(p.xz / 5. + floor(uT * 2.5) * vec2(3., 11.)) > 1. - .004 * near) c = #ffffff;
  float fo = depth - (.8 + .55 * sin(uT * 1.6 + vn(p.xz * .05) * 12.));
  if (fo < 0.) c = #f4f0e8;
  else if (depth < 3.2 && near > .05 && fract(depth * .45 - uT * .22 + vn(p.xz * .03) * 2.) < .05) c = mix(c, #e0f4f0, .85);
  return effects(c, p, true, bay);
}

vec3 shadeLand(vec3 p, vec4 tx, vec4 bio, float t, float bay){
  float h = tx.r, e = uCell;
  float hx = HT(p.xz + vec2(e, 0)) - HT(p.xz - vec2(e, 0));
  float hz = HT(p.xz + vec2(0, e)) - HT(p.xz - vec2(0, e));
  vec3 n = normalize(vec3(-hx, 2. * e, -hz));
  float slope = 1. - n.y;
  float near = smoothstep(3500., 600., t);
  float sh = tx.a * cloudShadow(p) * jetShadow(p);
  float lit = max(dot(n, uSun), 0.) * sh;
  float jit = (h21(p.xz / 6.) - .5) * near * .6;
  float nz = vn(p.xz / 40.);
  float lv = lit * 3.1 + .12 + (bay - .5) * .36;
  vec3 L, M, D;
  float jb = (bay - .5) * .5;
  float wI = bio.r + jb * .5, wV = bio.g + jb * .5, wF = bio.b + jb * .5, wA = 1. - bio.r - bio.g - bio.b + jb * .5;
  float biome = 0.; float bm = wA;
  if (wI > bm) { bm = wI; biome = 1.; } if (wV > bm) { bm = wV; biome = 2.; } if (wF > bm) { bm = wF; biome = 3.; }
  float camD = length(p.xz - uCamP.xz), nearT = camD < uTreeR - 40. * bay ? 1. : 0.;
  // lava in craters and rivers
  if (biome == 2.) {
    for (int i = 0; i < 4; i++) {
      vec4 v = uVolc[i]; if (v.w < 0.) continue;
      float dv = length(tor(p.xz - v.xy));
      if (dv < 210. && h < v.z) return shadeLava(p, t, bay);
      float riv = abs(vn(p.xz / 240. + float(i) * 13.) - .5);
      if (dv < 2400. && dv > 250. && riv < .022 * (1. - dv / 2400.) + .004) return shadeLava(p, t, bay);
      if (dv < 2400. && riv < .05 * (1. - dv / 2400.) + .01) { L = #e04818; M = #902818; D = #3c3444; vec3 col = lv > 1.35 ? L : (lv > .42 ? M : D); return effects(col, p, false, bay); }
    }
  }
  if (biome == 2.) {
    if (h < 2.2 + nz * 3. && slope < .3) { L = #4a4058; M = #3c3444; D = #2a2232; }
    else if (nz + tx.b * .4 > .78) { L = #908088; M = #6a5e70; D = #3c3444; }
    else { L = #6a5e70; M = #4a4058; D = #2a2232; lv += jit * .5; }
  }
  else if (biome == 1.) {
    if (slope > .45) { L = #b8d8e8; M = #8a7a98; D = #4c4068; lv += jit * .5; }
    else if (nearT < .5 && tx.g + (nz - .5) * .3 > .05 && h < uSnow * .6 && vn(p.xz / 14.) + (bay - .5) * .25 > .46) { L = #3c5844; M = #2a4038; D = #1a2430; }
    else { L = #fff8f0; M = #e0d8f0; D = #9890c0; }
  }
  else if (biome == 3. && slope < .3 && h < uSnow * .6 && !(h < 2.2 + nz * 3.)) {
    vec2 fc = p.xz / 150., fi = floor(fc + vn(p.xz / 300.) * .3), ff = fract(fc + vn(p.xz / 300.) * .3);
    float fr = h21(fi + 31.), edge = min(min(ff.x, 1. - ff.x), min(ff.y, 1. - ff.y)) * 150.;
    float rows = fract((h21(fi + 7.) > .5 ? p.x : p.z) / 5.);
    if (fr < .3) { L = #a8c060; M = #7ca048; D = #4c6c38; }
    else if (fr < .5) { L = #e0c860; M = #d0c080; D = #a87850; }
    else if (fr < .65) { L = #a87850; M = #6c4c38; D = #4c4058; }
    else { L = #b8cc70; M = #8cac58; D = #4c6440; }
    if (near > .2 && rows < .25 && fr < .65) lv -= .5;
    if (edge < 2.5) { L = #7ca048; M = #4c6c38; D = #2a4038; }
  }
  else if (h < 2.2 + nz * 3. && slope < .3) { L = #f0d8a8; M = #d8b888; D = #9a7c80; }
  else if (h > uSnow + nz * 70. && slope < .55) { L = #fff8f0; M = #e0d8f0; D = #9890c0; }
  else if (slope > .45 || (h > uSnow * .74 + nz * 60. && slope > .16)) { L = #b8a8b8; M = #8a7a98; D = #4c4068; lv += jit * .5; }
  else {
    float forest = tx.g + (nz - .5) * .3;
    float altF = smoothstep(uSnow * .86, uSnow * .62, h);
    if (nearT > .5 && tx.g > -.12 && altF > .35) { L = #9a7c80; M = #6c4c38; D = #4c1c38; lv -= .25; }
    else if (forest > -.12 && altF > .35) {
      float conP = .1 + .5 * smoothstep(uSnow * .3, uSnow * .7, h) + (1. - altF) * .4;
      vec2 kc = p.xz / 7., ki = floor(kc), kf = fract(kc) - .5 - (vec2(h21(ki + 3.), h21(ki + 11.)) - .5) * .4;
      bool con = near > .25 ? (h21(ki + vec2(17., 3.)) < conP && length(kf) < .3 + .14 * h21(ki + 5.)) : h21(ki + vec2(17., 3.)) < conP * .55;
      vec2 cc = p.xz / 5.5, ci = floor(cc), cf = fract(cc) - .5 - (vec2(h21(ci + 1.), h21(ci + 9.)) - .5) * .35;
      float crown = length(cf);
      lv += (crown < .36 ? (.42 - crown) * .9 : -.4) * near;
      if (con) { L = #3c5844; M = #2a4038; D = #1a2430; if (near > .25 && length(kf + vec2(.08, -.08)) < .12) lv += .6; }
      else {
        float cs = tx.b + (vn(p.xz / 34.) - .5) * .36;
        if (cs < .4) { L = #f08838; M = #c85a28; D = #6c2c38; }
        else if (cs < .6) { L = #c83840; M = #942838; D = #4c1c38; }
        else { L = #f0c040; M = #c89028; D = #6c4c38; }
      }
    } else {
      lv += jit * .35;
      if (nz + tx.b * .5 > .72) { L = #d0c080; M = #a8a060; D = #6c6464; }
      else { L = #e0d098; M = #c0b070; D = #7c7068; }
    }
  }
  vec3 col = lv > 1.35 ? L : (lv > .42 ? M : D);
  if (near > .15 && slope > .04 && fract(h / 34.) < .07) col *= .9;
  if (bio.a > 0.) { float bd = (1. - bio.a) * 120., bw = 2.5 + t * .0025; if (bd < bw && fract((p.x + p.z) / 26.) < .55) col = #f4f0e8; }
  return effects(col, p, false, bay);
}

void main(){
  vec2 fc = gl_FragCoord.xy; float bay = bayer(fc);
  vec3 rd = normalize(uCamF + uCamR * vNdc.x * uTan.x + uCamU * vNdc.y * uTan.y);
  vec3 ro = uCamP;
  float tmax = 26000.;
  vec3 cn; float tc = marchCloud(ro, rd, tmax, cn);
  float tt = marchTerrain(ro, rd, tc >= 0. ? tc : tmax);
  vec3 col; float th = -1.;
  if (tt >= 0.) {
    vec3 p = ro + rd * tt; vec4 tx = TX(p.xz); th = tt;
    vec4 bio = BIO(p.xz);
    if (tx.r < 0.) { p.y = 0.; col = bio.g > .5 ? shadeLava(p, tt, bay) : bio.r > .5 ? shadeIce(p, tx, tt, bay) : shadeWater(p, rd, tx, tt, bay); } else col = shadeLand(p, tx, bio, tt, bay);
    if (uDbg > 2.5 && jetShadow(p) < 1.) col = vec3(1, 0, 1);
  } else if (tc >= 0.) {
    vec3 p = ro + rd * tc; th = tc;
    vec3 nb = normalize(cn + vec3(vn(p.xz / 28. + p.y / 37.) - .5, 0., vn(p.zx / 28. - p.y / 41.) - .5) * 1.1);
    float l = dot(nb, uSun) + (bay - .5) * .14 - (1. - clamp((p.y - uCB) / uCT, 0., 1.)) * .22;
    if (cn.y < -.5) col = h21(p.xz / 40.) > .5 ? #7a628c : #6e5a84;
    else col = l > .42 ? #fff0d8 : l > .2 ? #f4c4a0 : l > .02 ? #d898a0 : #a07898;
    if (jetShadow(p) < .5) col *= vec3(.74, .7, .86);
  } else {
    col = rd.y < 0. ? hazeCol(rd) * .95 : skyCol(rd, true);
  }
  if (abs(uDbg - 2.) < .5) { vec2 q = ro.xz + rd.xz * ((uCB - ro.y) / rd.y); oC = vec4(vec3(CLD(q)), 1.); oA = vec4(0.); gl_FragDepth = .999; return; }
  if (abs(uDbg - 1.) < .5) { col = vec3(tt >= 0. ? 1. : 0., tc >= 0. ? 1. : 0., 0.); if (tt >= 0. && TX((ro + rd * tt).xz).r < 0.) col.b = 1.; oC = vec4(col, 1.); oA = vec4(0.); gl_FragDepth = .999; return; }
  float depth = 1.;
  if (th >= 0.) {
    float f = 1. - exp(-th * .00009);
    col = mix(col, hazeCol(rd) * (rd.y < 0. ? .95 : 1.), f);
    float vz = max(th * dot(rd, uCamF), uNF.x);
    float nd = (uNF.y + uNF.x) / (uNF.y - uNF.x) - 2. * uNF.y * uNF.x / ((uNF.y - uNF.x) * vz);
    depth = clamp(nd * .5 + .5, 0., 1.);
  }
  oC = vec4(col, 1.); oA = vec4(0.);
  gl_FragDepth = depth;
}`;

/* ---------- flat-shaded meshes (jet, missiles) ---------- */
const MESH_VS = `#version 300 es
in vec3 aP; in vec3 aC; in float aE;
uniform mat4 uVP, uM;
out vec3 vW; out vec3 vC; out float vE;
void main(){ vec4 w = uM * vec4(aP, 1.); vW = w.xyz; vC = aC; vE = aE; gl_Position = uVP * w; }`;
const MESH_FS = `#version 300 es
precision highp float;
in vec3 vW; in vec3 vC; in float vE;
layout(location=0) out vec4 oC;
layout(location=1) out vec4 oA;
uniform vec3 uSun, uCam, uGlow; uniform float uShade;
void main(){
  vec3 n = normalize(cross(dFdx(vW), dFdy(vW)));
  if (dot(n, uCam - vW) < 0.) n = -n;
  vec3 c = vC;
  if (vE > .5) { oC = vec4(uGlow, 1.); oA = vec4(1.); return; }
  float l = dot(n, uSun) * uShade;
  vec3 col = l > .42 ? c * #ffe8c8 * 1.12 : (l > .02 ? c * .82 : c * vec3(.55, .52, .7));
  oC = vec4(min(col, vec3(1.)), 1.); oA = vec4(1.);
}`;

/* ---------- particles (dither-alpha point sprites) ---------- */
const PT_VS = `#version 300 es
in vec3 aP; in float aS; in vec4 aCol;
uniform mat4 uVP; uniform float uPS, uMaxPS;
out vec4 vCol; flat out float vSh;
void main(){
  vec4 c = uVP * vec4(aP, 1.); gl_Position = c;
  float s = abs(aS) * uPS / max(c.w, .1);
  vCol = aCol; vSh = aS > 0. ? 1. : 0.;
  if (s < 1.) vCol.a *= s;
  gl_PointSize = clamp(floor(s + .5), 1., uMaxPS);
}`;
const PT_FS = `#version 300 es
precision highp float;
in vec4 vCol; flat in float vSh;
layout(location=0) out vec4 oC;
${COMMON}
void main(){
  vec2 q = gl_PointCoord - .5;
  if (dot(q, q) > .25) discard;
  if (vCol.a <= bayer(gl_FragCoord.xy)) discard;
  vec3 c = vCol.rgb;
  if (vSh > .5) { float k = q.x + q.y + (bayer(gl_FragCoord.xy) - .5) * .12; if (k > .14) c *= vec3(.78, .74, .86); else if (k < -.3 && dot(q, q) > .1) c = min(c * 1.12 + .04, vec3(1.)); }
  oC = vec4(c, 1.);
}`;
const LN_VS = `#version 300 es
in vec3 aP; in vec4 aCol; uniform mat4 uVP; out vec4 vCol;
void main(){ vCol = aCol; gl_Position = uVP * vec4(aP, 1.); }`;
const LN_FS = `#version 300 es
precision highp float;
in vec4 vCol; layout(location=0) out vec4 oC;
${COMMON}
void main(){ if (vCol.a <= bayer(gl_FragCoord.xy)) discard; oC = vec4(vCol.rgb, 1.); }`;

/* ---------- post: outline + palette + ordered dither ---------- */
const POST_FS = `#version 300 es
precision highp float;
uniform sampler2D uCol, uAux;
uniform sampler2D uPalT;
uniform int uPalN;
uniform float uSpread;
uniform ivec2 uSize;
out vec4 o;
${COMMON}
float A(ivec2 p){ return texelFetch(uAux, clamp(p, ivec2(0), uSize - 1), 0).r; }
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec3 c = texelFetch(uCol, p, 0).rgb;
  if (A(p) < .5) {
    float m = max(max(A(p + ivec2(1, 0)), A(p - ivec2(1, 0))), max(A(p + ivec2(0, 1)), A(p - ivec2(0, 1))));
    if (m > .5) { o = vec4(#120e1a, 1.); return; }
  }
  if (uPalN == 0) { o = vec4(c, 1.); return; }
  c += (bayer(gl_FragCoord.xy) - .5) * uSpread;
  float best = 1e9; vec3 bc = c;
  for (int i = 0; i < 256; i++) {
    if (i >= uPalN) break;
    vec3 q = texelFetch(uPalT, ivec2(i, 0), 0).rgb, d = c - q; float rm = (c.r + q.r) * .5;
    float dd = (2. + rm) * d.r * d.r + 4. * d.g * d.g + (3. - rm) * d.b * d.b;
    if (dd < best) { best = dd; bc = q; }
  }
  o = vec4(bc, 1.);
}`;

const progWorld = program(FS_TRI, WORLD_FS);
const progMesh = program(MESH_VS, MESH_FS);
const progPt = program(PT_VS, PT_FS);
const progLn = program(LN_VS, LN_FS);

const emptyVAO = gl.createVertexArray();

/* =========================================================================
   Aircraft mesh (original twin-tail fighter), missile mesh
   ========================================================================= */
const MC = {
  grey: '#9aa2ae', slate: '#5c6678', dslate: '#464e60', radome: '#2a2a34', canopy: '#e0b048', canopyD: '#a07828',
  red: '#c83030', noz: '#3c3844', noz2: '#524c58', intake: '#18161e', cap: '#2a2832', mis: '#c8c8cc', misN: '#3a3a40', misB: '#c83030'
};
function meshBuilder() {
  const d = [];
  const tri = (a, b, c, col, e = 0) => { const k = hex3(col); for (const v of [a, b, c]) d.push(v[0], v[1], -v[2], k[0], k[1], k[2], e); };
  const quad = (a, b, c, e4, col, e = 0) => { tri(a, b, c, col, e); tri(a, c, e4, col, e); };
  return { d, tri, quad };
}
function camo(c) {
  const a = Math.sin(c[0] * 1.25 + c[2] * 0.52 + 1.7) + Math.sin(c[2] * 0.85 - c[0] * 0.66 + c[1] * 1.3 + 0.4);
  return a > 0.45 ? MC.slate : (a < -0.75 ? MC.dslate : MC.grey);
}
const cen = (...p) => { const r = [0, 0, 0]; for (const v of p) { r[0] += v[0]; r[1] += v[1]; r[2] += v[2]; } return r.map(x => x / p.length); };
function gridQuad(M, A, B, C, D, nu, nv, colFn) {
